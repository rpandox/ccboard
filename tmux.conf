# ccboard tmux server options (socket -L ccboard). -q keeps older tmux (22.04's 3.2a) from erroring on unknown options.
set -s exit-empty off
set -s escape-time 10
set -g default-terminal tmux-256color
set -g mouse on
set -g history-limit 50000
set -g window-size latest
set -gq allow-passthrough on
set -sq extended-keys on
set -asq terminal-features 'xterm*:extkeys'
# viewers (v0.5.7): one window per session sized by its newest full client; grid tiles attach with -f ignore-size and never resize it
setw -g aggressive-resize off
set -g focus-events off
set -gq default-size 200x50
