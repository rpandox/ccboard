name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Two quick pushes must not race for the `latest` tag: Watchtower on the box follows it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y tmux
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ver = vX.Y.Z when the commit subject starts with one (empty otherwise); short = the 7-char sha.
      - id: ver
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ver=$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1 | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$)' | tr -d '[:space:]' || true)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rpandox/ccboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.ver || 'unversioned' }},enable=${{ steps.ver.outputs.ver != '' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CCBOARD_VERSION=${{ steps.ver.outputs.ver || format('sha-{0}', steps.ver.outputs.short) }}
            CCBOARD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
