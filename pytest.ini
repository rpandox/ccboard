[pytest]
# Issue #123. --strict-markers: a marker that is not listed here is an error, not a typo that silently selects nothing.
# tests/conftest.py (pytest_collection_modifyitems) skips each of these on a host that lacks what it names, with the reason in the report.
addopts = --strict-markers
markers =
    linux_only: needs a Linux host (skipped elsewhere)
    needs_tmux: needs a real tmux on PATH (skipped without one)
    needs_systemd: needs a Linux host running systemd (skipped elsewhere)
    needs_proc: needs a readable /proc (skipped without one)
    posix_sh: runs a shell script under the host's sh (skipped without sh, so never on native Windows)
    needs_macos: needs a macOS host (skipped elsewhere)
