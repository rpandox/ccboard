<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ccboard terminal</title>
<meta name="theme-color" content="#14181c">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ccboard">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/vendor/fonts/jetbrains-mono-latin-wght-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/vendor/fonts/inter-latin-wght-normal.woff2">
<link rel="stylesheet" href="/static/vendor/blueprint/blueprint.css">
<link rel="stylesheet" href="/static/vendor/blueprint/blueprint-icons.css">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/term.css">
</head>
<body class="term bp5-dark">
<div id="termbar">
  <a class="bp5-button bp5-minimal" href="/" id="back"><span class="bp5-icon bp5-icon-chevron-left"></span><span class="bp5-button-text">board</span></a>
  <span id="termname" class="name"></span>
  <span id="termstate" class="dim"></span>
  <span id="termmsg" class="dim"></span>
</div>
<iframe id="tty" title="terminal" allow="clipboard-write"></iframe>
<div id="keys">
  <div class="row keys">
    <button class="bp5-button" data-key="Escape">Esc</button>
    <button class="bp5-button" data-key="C-c">Ctrl-C</button>
    <button class="bp5-button" data-key="Tab">Tab</button>
    <button class="bp5-button" data-key="Up">↑</button>
    <button class="bp5-button" data-key="Down">↓</button>
    <button class="bp5-button" data-key="Left">←</button>
    <button class="bp5-button" data-key="Right">→</button>
    <button class="bp5-button" data-key="BSpace">⌫</button>
    <button class="bp5-button" data-text="y" data-enter="1">y ⏎</button>
    <button class="bp5-button" data-key="Enter">Enter</button>
  </div>
  <div class="row quick" id="quick"></div>
  <form class="row send" id="sendform">
    <textarea id="sendtext" class="composer" rows="1" placeholder="type · Enter sends · ↵ new line" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"></textarea>
    <button class="bp5-button nl" type="button" id="nl" title="newline (Shift+Enter)" aria-label="insert newline">↵</button>
    <button class="bp5-button bp5-intent-primary" type="submit">Send</button>
    <button class="bp5-button" type="button" id="editquick" title="edit quick replies"><span class="bp5-icon bp5-icon-edit"></span></button>
  </form>
</div>
<script src="/static/core.js"></script>
<script src="/static/components.js"></script>
<script src="/static/term.js"></script>
</body>
</html>
