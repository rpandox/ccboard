<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ccboard terminal</title>
<meta name="theme-color" content="#14181c">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ccboard">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/vendor/fonts/jetbrains-mono-latin-wght-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/vendor/fonts/inter-latin-wght-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/vendor/blueprint/blueprint-icons-20.woff2">
<link rel="stylesheet" href="/static/vendor/blueprint/blueprint.css">
<link rel="stylesheet" href="/static/vendor/blueprint/blueprint-icons.css">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/term.css">
<link rel="stylesheet" href="/static/termkit.css">
</head>
<body class="term bp5-dark">
<!-- Skeleton only: term.js fills the header, the strip, the rail, the key bar and the quick replies with el() (no inline styles, no handlers). -->
<header id="termhead">
  <a id="back" class="bp5-button bp5-minimal" href="/#/agents" aria-label="Back" title="Back"><span class="bp5-icon bp5-icon-chevron-left" aria-hidden="true"></span></a>
  <div id="headid"></div>
  <div id="headtools"></div>
</header>
<div id="termmain">
  <section id="ctxstrip" class="hidden" aria-label="Task and prompt"></section>
  <div id="ttywrap">
    <iframe id="tty" title="terminal" allow="clipboard-write"></iframe>
    <div id="rail" role="toolbar" aria-label="Scroll the terminal"></div>
    <button id="histchip" class="bp5-button chip-history hidden" type="button" aria-label="Leave history and go live" title="Leave history">History</button>
  </div>
  <div id="keyhost"></div>
  <div id="quickrow">
    <div id="quick"></div>
    <div id="qtools"></div>
  </div>
  <form id="sendform" autocomplete="off">
    <textarea id="sendtext" class="composer" rows="1" placeholder="send" aria-label="Send to the terminal" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"></textarea>
    <button class="bp5-button nl" type="button" id="nl" title="newline (Shift+Enter)" aria-label="insert newline">↵</button>
    <button class="bp5-button bp5-intent-primary" type="submit" id="sendbtn">Send</button>
  </form>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<script defer src="/static/core.js"></script>
<script defer src="/static/components.js"></script>
<script defer src="/static/termkit.js"></script>
<script defer src="/static/term.js"></script>
</body>
</html>
